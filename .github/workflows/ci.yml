name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (xtensa-esp32s3-none-elf)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install esp-rs toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          ldproxy: true
          buildtargets: esp32s3

      - name: Build (release)
        working-directory: Rust_Proteus_Simulation
        run: |
          cargo build --release -Zbuild-std=core,alloc --target xtensa-esp32s3-none-elf

      - name: Verify binary
        working-directory: Rust_Proteus_Simulation
        run: |
          ls -lh target/xtensa-esp32s3-none-elf/release/safe-concurrency-sensor-fusion
