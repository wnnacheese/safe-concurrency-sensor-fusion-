name: CI - ESP32-S3 Rust Build

on:
  push:
    branches: [main, master]
    paths:
      - 'Rust_Proteus_Simulation/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'Rust_Proteus_Simulation/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Check (esp-hal v1.1.1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rust_Proteus_Simulation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install espup (ESP32 Rust toolchain)
        run: |
          cargo install espup
          espup install

      - name: Add targets to PATH
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.rustup/toolchains/esp/xtensa-esp-elf/bin" >> $GITHUB_PATH

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Rust_Proteus_Simulation/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check (verify compilation)
        run: |
          cargo +esp check \
            -Zbuild-std=core,alloc \
            --target xtensa-esp32s3-none-elf

      - name: cargo build --release
        run: |
          cargo +esp build --release \
            -Zbuild-std=core,alloc \
            --target xtensa-esp32s3-none-elf

      - name: Verify binary exists
        run: |
          ls -lh target/xtensa-esp32s3-none-elf/release/safe-concurrency-sensor-fusion
          file target/xtensa-esp32s3-none-elf/release/safe-concurrency-sensor-fusion

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: safe-concurrency-sensor-fusion
          path: Rust_Proteus_Simulation/target/xtensa-esp32s3-none-elf/release/safe-concurrency-sensor-fusion
          retention-days: 30
