<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safe-Concurrency Block Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      min-height: 100vh;
      padding: 2rem;
      display: flex; justify-content: center;
    }
    .container { max-width: 1100px; width: 100%; }
    .header { margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; }
    .pulse-dot { width: 12px; height: 12px; background: #22d3ee; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.4rem; font-weight: 700; color: white; }
    .subtitle { color: #94a3b8; font-size: 0.8rem; margin-left: 1.75rem; margin-bottom: 0.5rem; }
    .diagram-container {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 1rem; border: 1px solid #1e293b;
      padding: 1.5rem; overflow-x: auto;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .footer { text-align: center; margin-top: 1rem; color: #475569; font-size: 0.75rem; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="pulse-dot"></div>
    <h1>Safe-Concurrency Multi-Sensor Fusion — Block Diagram</h1>
  </div>
  <p class="subtitle">ESP32-S3 Bare-Metal | Voting ≥2/3 | Adaptive Lockout 500/2000ms | Sticky Latch | Poll 100ms</p>

  <div class="diagram-container">
    <svg viewBox="0 0 1050 620">
      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
        </marker>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>

      <!-- ===== ESP32-S3 Boundary ===== -->
      <rect x="200" y="40" width="650" height="560" rx="14" fill="rgba(34, 211, 238, 0.03)" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8,4"/>
      <text x="215" y="62" fill="#22d3ee" font-size="11" font-weight="700">ESP32-S3 (Xtensa LX7, 240 MHz, bare-metal Rust)</text>

      <!-- ===== INPUT LAYER (left) ===== -->
      <rect x="30" y="100" width="140" height="60" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="100" y="120" fill="white" font-size="12" font-weight="600" text-anchor="middle">3× Sensors</text>
      <text x="100" y="138" fill="#94a3b8" font-size="9" text-anchor="middle">Temp | Press | Vib</text>
      <text x="100" y="152" fill="#fbbf24" font-size="7" text-anchor="middle">Normal: 25C, 1013hPa, 5</text>

      <rect x="30" y="190" width="140" height="50" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
      <text x="100" y="210" fill="white" font-size="12" font-weight="600" text-anchor="middle">Fault Button</text>
      <text x="100" y="226" fill="#94a3b8" font-size="9" text-anchor="middle">GPIO15 + Pull-down</text>

      <!-- ===== PROCESSING LAYER (center) ===== -->
      <!-- Sticky Latch + Hold -->
      <rect x="240" y="100" width="180" height="55" rx="6" fill="rgba(168, 85, 247, 0.25)" stroke="#c084fc" stroke-width="1.5"/>
      <text x="330" y="118" fill="white" font-size="11" font-weight="600" text-anchor="middle">Sticky Latch + Hold Counter</text>
      <text x="330" y="136" fill="#94a3b8" font-size="9" text-anchor="middle">hold_count++ | latch=TRUE</text>
      <text x="330" y="150" fill="#c084fc" font-size="7" text-anchor="middle">Captures brief button clicks</text>

      <!-- Sensor Injection -->
      <rect x="240" y="190" width="180" height="55" rx="6" fill="rgba(251, 113, 133, 0.25)" stroke="#fb7185" stroke-width="1.5"/>
      <text x="330" y="208" fill="white" font-size="11" font-weight="600" text-anchor="middle">Sensor Injection</text>
      <text x="330" y="226" fill="#94a3b8" font-size="9" text-anchor="middle">temp=99C, vib=9999</text>
      <text x="330" y="240" fill="#fb7185" font-size="7" text-anchor="middle">press=0 hPa IF hold >= 5s</text>

      <!-- Voting Logic -->
      <rect x="460" y="100" width="170" height="70" rx="6" fill="rgba(251, 191, 36, 0.2)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="545" y="118" fill="white" font-size="11" font-weight="600" text-anchor="middle">Voting Redundancy</text>
      <text x="545" y="136" fill="#94a3b8" font-size="9" text-anchor="middle">>= 2/3 anomalies?</text>
      <text x="545" y="154" fill="#fbbf24" font-size="8" text-anchor="middle">Thresholds: 80C | 900-1200hPa | 500</text>
      <text x="545" y="166" fill="#fbbf24" font-size="7" text-anchor="middle">1 sensor fault tolerated</text>

      <!-- Adaptive Lockout -->
      <rect x="670" y="100" width="160" height="70" rx="6" fill="rgba(251, 113, 133, 0.25)" stroke="#fb7185" stroke-width="1.5"/>
      <text x="750" y="118" fill="white" font-size="11" font-weight="600" text-anchor="middle">Adaptive Lockout</text>
      <text x="750" y="136" fill="#94a3b8" font-size="9" text-anchor="middle">MINOR: 500ms</text>
      <text x="750" y="152" fill="#94a3b8" font-size="9" text-anchor="middle">CRITICAL: 2000ms</text>
      <text x="750" y="166" fill="#fb7185" font-size="7" text-anchor="middle">Prevents valve bounce</text>

      <!-- Actuator -->
      <rect x="670" y="200" width="160" height="50" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="750" y="220" fill="white" font-size="11" font-weight="600" text-anchor="middle">Fail-Safe Actuator</text>
      <text x="750" y="236" fill="#94a3b8" font-size="9" text-anchor="middle">Valve GPIO3 (Red LED)</text>

      <!-- Counter -->
      <rect x="460" y="200" width="170" height="50" rx="6" fill="rgba(251, 191, 36, 0.2)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="545" y="218" fill="white" font-size="11" font-weight="600" text-anchor="middle">Lockout Countdown</text>
      <text x="545" y="236" fill="#94a3b8" font-size="9" text-anchor="middle">-100ms per iteration</text>

      <!-- Recovery -->
      <rect x="240" y="270" width="590" height="40" rx="6" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1.5"/>
      <text x="535" y="294" fill="white" font-size="11" font-weight="600" text-anchor="middle">Auto-Recovery: Lockout expired → Reset sensors → Return to NORMAL</text>

      <!-- State Machine Flow -->
      <rect x="240" y="330" width="590" height="45" rx="6" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="535" y="350" fill="white" font-size="10" font-weight="600" text-anchor="middle">State Machine: NORMAL → FAULT_DETECTED → LOCKOUT → LOCKOUT_CLEARED → NORMAL</text>
      <text x="535" y="366" fill="#94a3b8" font-size="8" text-anchor="middle">Event-triggered: evaluation only on button press or state transition</text>

      <!-- Data Output -->
      <rect x="240" y="400" width="590" height="45" rx="6" fill="rgba(76, 29, 149, 0.25)" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="535" y="418" fill="white" font-size="10" font-weight="600" text-anchor="middle">CSV Data Logging</text>
      <text x="535" y="436" fill="#94a3b8" font-size="8" text-anchor="middle">iter, temp, press, vib, latency_us, status → GNUPlot 5-panel visualization</text>

      <!-- ===== OUTPUT LAYER (right) ===== -->
      <rect x="890" y="100" width="130" height="60" rx="6" fill="rgba(251, 113, 133, 0.3)" stroke="#fb7185" stroke-width="1.5"/>
      <text x="955" y="120" fill="white" font-size="11" font-weight="600" text-anchor="middle">LED Red GPIO3</text>
      <text x="955" y="140" fill="#94a3b8" font-size="9" text-anchor="middle">Valve CLOSED</text>
      <text x="955" y="154" fill="#fb7185" font-size="7" text-anchor="middle">ON = Fault Active</text>

      <rect x="890" y="180" width="130" height="60" rx="6" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1.5"/>
      <text x="955" y="200" fill="white" font-size="11" font-weight="600" text-anchor="middle">LED Green GPIO4</text>
      <text x="955" y="220" fill="#94a3b8" font-size="9" text-anchor="middle">System NORMAL</text>
      <text x="955" y="234" fill="#34d399" font-size="7" text-anchor="middle">ON = Safe</text>

      <rect x="890" y="260" width="130" height="60" rx="6" fill="rgba(251, 191, 36, 0.25)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="955" y="280" fill="white" font-size="11" font-weight="600" text-anchor="middle">LED Yellow GPIO5</text>
      <text x="955" y="300" fill="#94a3b8" font-size="9" text-anchor="middle">Lockout Active</text>
      <text x="955" y="314" fill="#fbbf24" font-size="7" text-anchor="middle">ON = Waiting</text>

      <!-- ===== ARROWS ===== -->
      <!-- Sensors → Voting -->
      <line x1="170" y1="130" x2="235" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <!-- Button → Sticky Latch -->
      <line x1="170" y1="210" x2="235" y2="210" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrowhead)"/>

      <!-- Sticky Latch → Injection -->
      <line x1="330" y1="155" x2="330" y2="185" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <!-- Sticky Latch → Voting (hold count) -->
      <path d="M 420 127 Q 440 127 440 135 L 455 135" fill="none" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrowhead)"/>

      <!-- Injection → Voting -->
      <path d="M 420 217 Q 440 217 440 170 L 455 170" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrowhead)"/>

      <!-- Voting → Adaptive Lockout -->
      <line x1="630" y1="135" x2="665" y2="135" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <text x="648" y="128" fill="#94a3b8" font-size="7" text-anchor="middle">FAULT</text>

      <!-- Voting → NORMAL (no fault) -->
      <line x1="545" y1="170" x2="545" y2="195" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <text x="555" y="183" fill="#94a3b8" font-size="7">NORMAL</text>

      <!-- Adaptive Lockout → Counter + Actuator -->
      <line x1="750" y1="170" x2="750" y2="195" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <line x1="670" y1="150" x2="635" y2="225" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrowhead)"/>

      <!-- Counter → Recovery -->
      <line x1="545" y1="250" x2="545" y2="265" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>

      <!-- Recovery → Loop back (implicit) -->
      <path d="M 240 290 L 200 290 L 200 127 L 235 127" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>

      <!-- Actuator → LEDs -->
      <line x1="830" y1="225" x2="885" y2="120" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <line x1="830" y1="225" x2="885" y2="210" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <line x1="830" y1="225" x2="885" y2="290" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>

      <!-- ===== LEGEND ===== -->
      <text x="30" y="430" fill="white" font-size="10" font-weight="600">Legend</text>
      <rect x="30" y="442" width="14" height="10" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
      <text x="50" y="451" fill="#94a3b8" font-size="8">Input</text>
      <rect x="100" y="442" width="14" height="10" rx="2" fill="rgba(168,85,247,0.25)" stroke="#c084fc" stroke-width="1"/>
      <text x="120" y="451" fill="#94a3b8" font-size="8">Latch/Counter</text>
      <rect x="230" y="442" width="14" height="10" rx="2" fill="rgba(251,113,133,0.25)" stroke="#fb7185" stroke-width="1"/>
      <text x="250" y="451" fill="#94a3b8" font-size="8">Fault/Injection</text>
      <rect x="370" y="442" width="14" height="10" rx="2" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="1"/>
      <text x="390" y="451" fill="#94a3b8" font-size="8">Decision/Voting</text>
      <rect x="520" y="442" width="14" height="10" rx="2" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1"/>
      <text x="540" y="451" fill="#94a3b8" font-size="8">Normal/Recovery</text>

      <text x="30" y="510" fill="white" font-size="11" font-weight="600">Key Innovation:</text>
      <text x="30" y="530" fill="#94a3b8" font-size="9">• Rust bare-metal on ESP32-S3 — zero unsafe, zero data races</text>
      <text x="30" y="546" fill="#94a3b8" font-size="9">• Mutex&lt;RefCell&lt;T&gt;&gt; + critical_section for safe concurrency</text>
      <text x="30" y="562" fill="#94a3b8" font-size="9">• Voting-based 3-sensor fusion with majority quorum (≥2/3)</text>
      <text x="30" y="578" fill="#94a3b8" font-size="9">• Adaptive lockout: MINOR 500ms (2/3 sensors) / CRITICAL 2000ms (3/3 sensors)</text>
      <text x="30" y="594" fill="#94a3b8" font-size="9">• Hold-duration detection: &lt;5s short press / ≥5s long press → severity classification</text>
      <text x="30" y="610" fill="#94a3b8" font-size="9">• Sticky latch ensures no button press is missed (Proteus-optimized, 100ms polling)</text>

    </svg>
  </div>
  <p class="footer">Safe-Concurrency Multi-Sensor Fusion • Abdurrauf Almutawakkil • ITS Teknik Instrumentasi 2025/2026</p>
</div>
</body>
</html>
